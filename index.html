const COLORS=['#d42c44','#187ac3','#139b7a','#9a54c5','#da8514','#6070c8','#b54e84','#5b6770'];
const roads=[...new Set(DATA.map(x=>x.road))].sort((a,b)=>a.localeCompare(b,'ru'));
const color=Object.fromEntries(roads.map((r,i)=>[r,COLORS[i%COLORS.length]]));
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([59,92],4);
L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
const tracks=L.tileLayer('https://tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',{maxZoom:18,opacity:.85,attribution:'Railway: © OpenRailwayMap, © OpenStreetMap contributors, CC BY-SA 2.0'}).addTo(map);
const markers=L.layerGroup().addTo(map),schematic=L.layerGroup().addTo(map);
const el=id=>document.getElementById(id);
for(const r of roads){const o=document.createElement('option');o.value=r;o.textContent=r;el('road').appendChild(o)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function label(x){return x.title+' '+x.road+' '+x.note}
function render(){markers.clearLayers();schematic.clearLayers();const q=el('search').value.toLowerCase().trim().replace(/пч\s*[-–]?\s*/g,'').trim(),road=el('road').value;
const matches=DATA.filter(x=>(!road||x.road===road)&&(!q||String(x.num)===q||label(x).toLowerCase().includes(q)));
const holder=el('results');holder.innerHTML='';const pins=[];
for(const x of matches){const selected=!!road;const icon=L.divIcon({className:'',html:`<div class="pin" style="background:${color[x.road]};${selected?'width:31px;height:31px;box-shadow:0 0 0 3px #fff,0 0 0 5px '+color[x.road]+';':''}">${x.num??'•'}</div>`,iconSize:[31,31],iconAnchor:[15,15]});
const marker=L.marker([x.lat,x.lon],{icon}).addTo(markers).bindPopup(`<b>${safe(x.title)}</b><br><span style="color:${color[x.road]}">●</span> ${safe(x.road)}<br>${safe(x.note||'Сведения требуют проверки')}<br><small>Метка ориентировочная, не адрес ПЧ.</small>`);pins.push(marker);
const btn=document.createElement('button');btn.className='item';btn.innerHTML=`<b><i class="badge" style="background:${color[x.road]}"></i>${safe(x.title)}</b><span>${safe(x.road)}</span>`;btn.onclick=()=>{map.setView([x.lat,x.lon],Math.max(map.getZoom(),9),{animate:true});marker.openPopup();if(window.innerWidth<600){el('panel').classList.add('collapsed');el('toggle').textContent='Развернуть'}};holder.appendChild(btn)}
if(!matches.length){holder.innerHTML='<div class="counter">Ничего не найдено в имеющемся наборе данных.</div>'}
el('counter').textContent=`Показано ${matches.length} из ${DATA.length} точек · ${road||'все дороги'}`;
if(road&&el('routes').checked){const pts=DATA.filter(x=>x.road===road).sort((a,b)=>a.lon-b.lon).map(x=>[x.lat,x.lon]);if(pts.length>1)L.polyline(pts,{color:color[road],weight:4,opacity:.65,dashArray:'7,9'}).addTo(schematic)}
}
el('search').addEventListener('input',render);el('road').addEventListener('change',()=>{render();const arr=DATA.filter(x=>!el('road').value||x.road===el('road').value);if(arr.length)map.fitBounds(L.latLngBounds(arr.map(x=>[x.lat,x.lon])),{padding:[35,35],maxZoom:8})});el('routes').addEventListener('change',render);el('tracks').addEventListener('change',()=>{el('tracks').checked?tracks.addTo(map):map.removeLayer(tracks)});el('reset').onclick=()=>{el('search').value='';el('road').value='';el('routes').checked=false;render();map.setView([59,92],4)};el('toggle').onclick=()=>{const c=el('panel').classList.toggle('collapsed');el('toggle').textContent=c?'Развернуть':'Свернуть'};render();
</script></body></html>
